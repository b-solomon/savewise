name: Daily Bug Checker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every day at 18:30 UTC (which is exactly 00:00 IST / Midnight IST)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-bugs:
    name: Run Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install build tools for native modules
        run: sudo apt-get install -y python3 make g++

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Check JavaScript Syntax
        run: |
          cd server
          for file in *.js scripts/*.js; do
            echo "Checking $file..."
            node --check "$file"
          done

      - name: Run Self-Diagnostic Tests
        working-directory: ./server
        env:
          PORT: 10000
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'savewise_ci_testing_jwt_secret_key_2026' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL_REJECT_UNAUTHORIZED: 'false'
          ENCRYPTION_SALT: ${{ secrets.ENCRYPTION_SALT || 'savewise_ci_testing_salt_2026' }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY || 'savewise_ci_testing_master_key_2026' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node scripts/bugCheck.js
